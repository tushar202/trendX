[project]
name = "trendx"
version = "0.1.0"
description = "Autonomous trend research and analysis agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "textual>=0.58.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.0.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "litellm>=1.44.0",
  "instructor>=1.6.0",
  "sentence-transformers>=2.6.0",
  "scikit-learn>=1.4.0",
  "numpy>=1.26.0",
  "jsonschema>=4.22.0",
  "beautifulsoup4>=4.12.0",
  "selectolax>=0.3.21",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
trendx = "trendx.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
